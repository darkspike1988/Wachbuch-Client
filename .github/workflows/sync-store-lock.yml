name: Sync Store Lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-store-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.head_ref == 'agent/store-release-1-0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/store-release-1-0
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve exact Flutter dependency lock
        run: flutter pub get
      - name: Commit lock only when resolution changed it
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock; then
            echo 'pubspec.lock already matches Flutter Stable.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git commit -m 'build: sync Flutter store lockfile'
          git push origin HEAD:agent/store-release-1-0
