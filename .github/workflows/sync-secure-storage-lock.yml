name: Sync Secure Storage Lockfile

on:
  push:
    branches: [agent/dsgvo-bsi-hardening]

permissions:
  contents: write

concurrency:
  group: sync-secure-storage-lock
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/dsgvo-bsi-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Resolve exact dependency lock
        run: |
          set -euo pipefail
          flutter pub get
          flutter pub deps | grep -F 'flutter_secure_storage 10.3.1'
          git diff --exit-code -- pubspec.yaml
      - name: Commit lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock; then
            echo 'pubspec.lock already matches Flutter Stable.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git commit -m 'build: sync lockfile for secure storage migration'
          git push origin HEAD:agent/dsgvo-bsi-hardening
