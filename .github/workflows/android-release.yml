name: Android Signed Release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Version name, for example 0.5.2
        required: true
        default: 0.5.1
      build_number:
        description: Unique and increasing Play version code
        required: true
        default: "10"

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: google-play

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Validate protected signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Install temporary upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/wachbuch-upload.jks"
          echo -n "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "REQUIRE_RELEASE_SIGNING=true"
          } >> "$GITHUB_ENV"

      - name: Verify source
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build signed production AAB
        run: >-
          flutter build appbundle
          --release
          --flavor production
          --build-name "${{ inputs.build_name }}"
          --build-number "${{ inputs.build_number }}"
          --obfuscate
          --split-debug-info=build/symbols/production

      - name: Build signed production APKs
        run: >-
          flutter build apk
          --release
          --flavor production
          --split-per-abi
          --build-name "${{ inputs.build_name }}"
          --build-number "${{ inputs.build_number }}"
          --obfuscate
          --split-debug-info=build/symbols/production

      - name: Run Android lint
        working-directory: android
        run: ./gradlew :app:lintProductionRelease

      - name: Verify signatures, identity and release properties
        run: |
          set -euo pipefail
          mkdir -p dist/aab dist/apk dist/reports dist/symbols

          AAB=$(find build/app/outputs/bundle -type f -name '*production*release*.aab' -print -quit)
          test -n "$AAB"
          jarsigner -verify -strict -verbose -certs "$AAB" > dist/reports/aab-signature.txt
          cp "$AAB" "dist/aab/wachbuch-${{ inputs.build_name }}-${{ inputs.build_number }}.aab"

          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          APKANALYZER=$(find "$ANDROID_SDK_ROOT" -type f -name apkanalyzer | head -n 1 || true)
          test -x "$APKSIGNER"

          mapfile -d '' APKS < <(find build/app/outputs/flutter-apk -type f -name '*production*release.apk' -print0)
          if [ "${#APKS[@]}" -lt 3 ]; then
            echo "Expected signed production APKs for all supported ABIs" >&2
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" \
              | tee -a dist/reports/apk-signatures.txt
            if [ -n "$APKANALYZER" ]; then
              app_id=$($APKANALYZER manifest application-id "$apk")
              debuggable=$($APKANALYZER manifest debuggable "$apk")
              test "$app_id" = "de.wachbuch.mobile"
              test "$debuggable" = "false"
            fi
            cp "$apk" dist/apk/
          done

          keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > dist/reports/upload-certificate.txt

          cp -R build/symbols/. dist/symbols/
          flutter pub deps --json > dist/reports/flutter-dependencies.json
          (cd android && ./gradlew :app:dependencies --configuration productionReleaseRuntimeClasspath) \
            > dist/reports/android-production-dependencies.txt
          cp build/app/reports/lint-results-productionRelease.html dist/reports/
          (cd dist && find aab apk -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wachbuch-google-play-aab-${{ inputs.build_number }}
          path: |
            dist/aab
            dist/SHA256SUMS
            dist/reports
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wachbuch-production-apks-${{ inputs.build_number }}
          path: |
            dist/apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wachbuch-android-symbols-${{ inputs.build_number }}
          path: dist/symbols
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/wachbuch-upload.jks"
