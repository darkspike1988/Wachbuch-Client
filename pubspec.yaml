name: wachbuch_mobile
description: AGPL companion app for self-hosted Wachbuch (iOS/Android).
publish_to: "none"
version: 0.5.1+9

environment:
  sdk: ^3.8.0

dependencies:
  app_links: ^7.2.1
  connectivity_plus: ^6.1.0
  crypto: ^3.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.4.0
  intl: ^0.19.0
  mobile_scanner: ^7.4.0
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.1.0
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  generate: true
